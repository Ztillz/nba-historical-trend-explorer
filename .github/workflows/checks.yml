name: Offline research checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/research.test.cjs
      - run: python tests/check_browser_parity.py
      - run: python tests/check_site.py
      - run: |
          node --check docs/app.js
          node --check docs/research-ui.js
          node --check docs/research-worker.js
      - run: npm install --no-save --ignore-scripts @playwright/test@1.64.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-browser-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 14
